<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SO · Clase Extra — La CLI Decorada</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg-0:#070a0f;
  --bg-1:#0d131b;
  --bg-2:#121a24;
  --panel-border:#1f2b38;
  --green:#39ff88;
  --green-dim:#1f8a52;
  --amber:#ffb454;
  --cyan:#5ccfe6;
  --gold:#f2b705;
  --gold-dim:#8a6a03;
  --red:#ff5c7a;
  --text:#dbe4ea;
  --text-dim:#6d7c8c;
  --mono:'JetBrains Mono', monospace;
  --display:'Space Grotesk', sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse at top left, rgba(242,183,5,0.07), transparent 45%),
    radial-gradient(ellipse at bottom right, rgba(57,255,136,0.05), transparent 50%),
    var(--bg-0);
  color:var(--text);
  font-family:var(--display);
  overflow:hidden;
  height:100vh;
}
::selection{ background:var(--gold); color:#211a02; }

.crt-overlay{
  position:fixed; inset:0; pointer-events:none; z-index:500;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
  mix-blend-mode:overlay;
}

.statusbar{
  position:fixed; top:0; left:0; right:0; height:42px; z-index:200;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 18px;
  background:linear-gradient(180deg, rgba(13,19,27,0.95), rgba(13,19,27,0.75));
  border-bottom:1px solid var(--panel-border);
  font-family:var(--mono); font-size:12.5px; letter-spacing:.03em;
  color:var(--text-dim);
}
.statusbar .seg{ display:flex; align-items:center; gap:8px; }
.statusbar .dot{ width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 6px var(--gold); animation:pulse 1.8s infinite; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
.statusbar .cursor{ display:inline-block; width:7px; background:var(--green); margin-left:2px; animation:blink 1s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
#module-badge{ font-weight:700; padding:2px 10px; border-radius:3px; border:1px solid currentColor; }
.mod-teoria{ color:var(--cyan); }
.mod-practica{ color:var(--amber); }

.progress-rail{ position:fixed; top:42px; left:0; right:0; height:3px; background:var(--bg-2); z-index:200; }
.progress-fill{ height:100%; background:linear-gradient(90deg, var(--gold-dim), var(--gold)); box-shadow:0 0 8px var(--gold); transition:width .5s ease; }

.deck{ position:relative; height:100vh; width:100vw; padding-top:45px; }
.slide{ position:absolute; inset:0; top:45px; display:none; padding:38px 64px 74px 64px; overflow-y:auto; }
.slide.active{ display:block; }
.slide-inner{ max-width:1180px; margin:0 auto; }

.eyebrow{
  font-family:var(--mono); font-size:12.5px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--gold); display:flex; align-items:center; gap:10px; margin-bottom:14px;
}
.eyebrow::before{ content:'//'; color:var(--text-dim); }

h1.title{ font-size:2.5rem; font-weight:700; margin:0 0 .3rem 0; line-height:1.1; }
h2.subtitle{ font-size:1.1rem; font-weight:400; color:var(--text-dim); margin-bottom:1.6rem; }
.accent{ color:var(--gold); }
.accent-amber{ color:var(--amber); }
.accent-cyan{ color:var(--cyan); }
.accent-green{ color:var(--green); }
.accent-red{ color:var(--red); }

.panel{
  background:linear-gradient(180deg, var(--bg-1), var(--bg-2));
  border:1px solid var(--panel-border); border-radius:10px; padding:22px 26px; position:relative;
}
.panel::before{
  content:''; position:absolute; top:0; left:16px; right:16px; height:1px;
  background:linear-gradient(90deg, transparent, rgba(242,183,5,.4), transparent);
}
.term-tag{
  font-family:var(--mono); font-size:11px; color:var(--text-dim); position:absolute; top:-10px; left:16px;
  background:var(--bg-0); padding:0 6px; border:1px solid var(--panel-border); border-radius:3px;
}

.cover{ height:calc(100vh - 45px); display:flex; flex-direction:column; justify-content:center; }
.boot-lines{ font-family:var(--mono); font-size:12.5px; color:#6b5a1f; margin-bottom:26px; line-height:1.9; }
.boot-lines .ok{ color:var(--green); }
.mega{ font-size:3.2rem; font-weight:700; line-height:1.05; margin:0; }
.mega .kernel{ color:var(--gold); }

.mod-hero{ height:calc(100vh - 45px); display:flex; flex-direction:column; justify-content:center; align-items:flex-start; position:relative; }
.mod-num{ font-family:var(--mono); font-size:5rem; font-weight:700; opacity:.18; position:absolute; right:70px; top:90px; }

ul.checklist{ list-style:none; padding:0; margin:0; }
ul.checklist li{ padding:9px 0 9px 30px; position:relative; border-bottom:1px dashed var(--panel-border); font-size:1.02rem; }
ul.checklist li:last-child{ border-bottom:none; }
ul.checklist li::before{ content:'\f00c'; font-family:'Font Awesome 6 Free'; font-weight:900; color:var(--green); position:absolute; left:0; top:9px; font-size:.85rem; }

.grid-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
.card-min{ background:var(--bg-1); border:1px solid var(--panel-border); border-radius:8px; padding:16px; transition:transform .2s, border-color .2s; position:relative; }
.card-min:hover{ transform:translateY(-3px); border-color:var(--gold-dim); }
.card-min i{ color:var(--cyan); font-size:1.15rem; margin-bottom:6px; display:block; }
.card-min h4{ font-size:.92rem; margin-bottom:3px; }
.card-min p{ font-size:.8rem; color:var(--text-dim); margin:0; }

table.colortab{ width:100%; border-collapse:collapse; font-size:.82rem; }
table.colortab th{ font-family:var(--mono); text-transform:uppercase; font-size:.66rem; letter-spacing:.05em; color:var(--text-dim); border-bottom:1px solid var(--panel-border); padding:6px 8px; text-align:left; }
table.colortab td{ padding:7px 8px; border-bottom:1px solid var(--panel-border); font-family:var(--mono); }
.swatch{ display:inline-block; width:14px; height:14px; border-radius:3px; margin-right:8px; vertical-align:middle; border:1px solid rgba(255,255,255,.15); }

.code-block{
  background:#04070b; border:1px solid var(--panel-border); border-radius:8px; padding:16px 18px;
  font-family:var(--mono); font-size:.78rem; color:var(--cyan); overflow-x:auto; white-space:pre;
}
.code-block .c-green{ color:var(--green); }
.code-block .c-dim{ color:var(--text-dim); }
.code-block .c-amber{ color:var(--amber); }
.code-block .c-gold{ color:var(--gold); }
.code-block .c-red{ color:var(--red); }

/* mockup de terminal decorada */
.term-mock{
  background:#000; border:2px solid #333; border-radius:4px; font-family:var(--mono); font-size:.8rem;
  line-height:1.5; padding:10px 14px; color:#aaa; max-width:560px;
}
.term-mock .box-line{ color:#ccc; }
.term-mock .title-row{ color:var(--gold); }
.term-mock .ok-row{ color:var(--green); }
.term-mock .err-row{ color:var(--red); }
.term-mock .statusrow{ background:#1a1a1a; color:#0ff; }

.btn-quiz{
  background:transparent; border:1px solid var(--gold-dim); color:var(--gold);
  font-family:var(--mono); border-radius:6px; padding:10px 18px; font-size:.85rem; transition:.2s;
}
.btn-quiz:hover{ background:var(--gold); color:#211a02; }

.nav-btn{
  position:fixed; top:50%; transform:translateY(-50%); z-index:150;
  width:46px; height:46px; border-radius:50%; border:1px solid var(--panel-border);
  background:rgba(13,19,27,.85); color:var(--text-dim); display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:.2s; backdrop-filter:blur(3px);
}
.nav-btn:hover{ color:var(--gold); border-color:var(--gold-dim); }
#prevBtn{ left:16px; } #nextBtn{ right:16px; }

.slide-counter{ position:fixed; bottom:14px; right:24px; z-index:150; font-family:var(--mono); font-size:.78rem; color:var(--text-dim); }
.slide-dots{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:150; display:flex; gap:6px; }
.slide-dots span{ width:6px; height:6px; border-radius:50%; background:var(--panel-border); cursor:pointer; }
.slide-dots span.on{ background:var(--gold); box-shadow:0 0 6px var(--gold); }

.swal2-popup.so-popup{ background:var(--bg-1) !important; color:var(--text) !important; border:1px solid var(--panel-border); font-family:var(--display); }
.so-title{ font-family:var(--mono) !important; font-size:1.1rem !important; color:var(--gold) !important; }

@media (max-width: 768px){
  .mega{ font-size:1.8rem; }
  h1.title{ font-size:1.5rem; }
  .slide{ padding:24px 20px 90px 20px; }
  .mod-num{ display:none; }
}
</style>
</head>
<body>
<div class="crt-overlay"></div>

<div class="statusbar">
  <div class="seg"><span class="dot"></span> SO · CAMPUS SALTO <span class="cursor">&nbsp;</span></div>
  <div class="seg" id="module-badge">MÓDULO 1 · TEORÍA</div>
  <div class="seg"><i class="fa-regular fa-clock"></i> <span id="clockLabel">18:15 – 19:35</span></div>
</div>
<div class="progress-rail"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<div class="deck" id="deck"></div>

<div class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></div>
<div class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></div>
<div class="slide-counter"><span id="counterNow">1</span> / <span id="counterTotal">1</span></div>
<div class="slide-dots" id="dotsWrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.7/sweetalert2.all.min.js"></script>

<script>
const slides = [];
function addSlide(html, opts={}){
  slides.push({html, module:opts.module || 1, mtype: opts.mtype || 'teoria', clock: opts.clock || ''});
}

/* ============ MÓDULO 1 · TEORÍA ============ */

addSlide(`
<div class="cover animate__animated animate__fadeIn">
  <div class="boot-lines">
    <div>[ <span class="ok">OK</span> ] Shell cargada .......................... modo texto 80x25</div>
    <div>[ <span class="ok">OK</span> ] Cargando paleta de 16 colores</div>
    <div>[ <span class="ok">OK</span> ] Preparando barra de estado</div>
  </div>
  <div class="eyebrow">clase extra · opcional</div>
  <h1 class="mega">La CLI<br><span class="kernel">Decorada</span></h1>
  <h2 class="subtitle" style="margin-top:1rem;">Color, cajas y una barra de estado — sin salir del modo texto</h2>
  <div style="font-family:var(--mono); font-size:.85rem; color:var(--text-dim);">
    <i class="fa-solid fa-keyboard"></i> usá <span class="accent">← →</span> o hacé click en las flechas para navegar
  </div>
</div>
`, {module:1, mtype:'teoria', clock:'18:15 – 19:35'});

addSlide(`
<div class="slide-inner animate__animated animate__fadeInUp">
  <div class="eyebrow">de qué se trata esta clase</div>
  <h1 class="title">El obligatorio sigue siendo <span class="accent">la shell</span></h1>
  <div class="panel">
    <p style="font-size:1.02rem; line-height:1.7;">
      Esto no cambia el checklist ni la nota: la shell de línea de comandos que ya vienen armando sigue siendo
      el entregable. Lo que vemos hoy es <b>cómo darle un poco de identidad visual</b> a esa misma shell, usando
      solo lo que el modo texto VGA ya nos da gratis — sin tocar un solo pixel, sin driver de mouse, sin modo gráfico.
    </p>
  </div>
  <div class="grid-cards" style="margin-top:18px;">
    <div class="card-min"><i class="fa-solid fa-palette"></i><h4 class="accent-cyan">Módulo 1 · Teoría</h4><p>Cómo funciona el color en modo texto: el byte de atributo</p></div>
    <div class="card-min"><i class="fa-solid fa-code"></i><h4 class="accent-amber">Módulo 2 · Práctica</h4><p>Cajas con caracteres de dibujo + una barra de estado fija</p></div>
    <div class="card-min"><i class="fa-solid fa-play"></i><h4 class="accent-amber">Módulo 3 · Práctica</h4><p>Armar el prompt decorado completo + quiz final</p></div>
  </div>
</div>
`, {module:1, mtype:'teoria', clock:'18:15 – 19:35'});

addSlide(`
<div class="slide-inner animate__animated animate__fadeInUp">
  <div class="eyebrow">repaso rápido</div>
  <h1 class="title">Cada carácter en pantalla son en realidad <span class="accent">2 bytes</span></h1>
  <div class="panel">
    <p style="line-height:1.7;">
      Ya vimos que el modo texto VGA vive en la dirección <code>0xB8000</code>. Lo que no profundizamos es que
      cada posición de la grilla de 80×25 no ocupa 1 byte, sino <b>2</b>: un byte de <b class="accent-cyan">carácter</b>
      (el código ASCII/CP437 de la letra) y un byte de <b class="accent-gold">atributo</b> (qué color tiene esa letra
      y qué color tiene el fondo detrás de ella).
    </p>
    <div class="code-block" style="margin-top:14px;">
<span class="c-dim">// una celda de la pantalla en memoria:</span>
<span class="c-gold">byte 0</span>: carácter   <span class="c-dim">(ej: 'H' = 0x48)</span>
<span class="c-gold">byte 1</span>: atributo    <span class="c-dim">(color de texto + color de fondo)</span>
    </div>
  </div>
</div>
`, {module:1, mtype:'teoria', clock:'18:15 – 19:35'});

addSlide(`
<div class="slide-inner animate__animated animate__fadeInUp">
  <div class="eyebrow">el byte de atributo, en detalle</div>
  <h1 class="title">4 bits para el <span class="accent-gold">texto</span>, 4 para el <span class="accent-cyan">fondo</span></h1>
  <div class="panel">
    <div class="code-block">
<span class="c-dim">bit:</span>  7 6 5 4  3 2 1 0
<span class="c-dim">uso:</span>  <span class="c-cyan">F F F F</span>  <span class="c-gold">T T T T</span>
      <span class="c-dim">↑ fondo (0-15)   ↑ texto (0-15)</span>
    </div>
    <p style="margin-top:14px; line-height:1.7;">
      El byte de atributo se arma con un simple <code>(fondo << 4) | texto</code>. Con 4 bits para cada uno
      tenemos 16 colores posibles de cada lado — la misma paleta clásica de 16 colores del VGA en modo texto.
    </p>
  </div>
</div>
`, {module:1, mtype:'teoria', clock:'18:15 – 19:35'});

addSlide(`
<div class="slide-inner animate__animated animate__fadeInUp">
  <div class="eyebrow">la paleta de 16 colores</div>
  <h1 class="title">Los colores que ya tenemos <span class="accent">disponibles</span></h1>
  <div class="panel">
    <table class="colortab">
      <tr><th>#</th><th>Color</th><th>#</th><th>Color</th></tr>
      <tr><td>0x0</td><td><span class="swatch" style="background:#000"></span>Negro</td><td>0x8</td><td><span class="swatch" style="background:#555"></span>Gris oscuro</td></tr>
      <tr><td>0x1</td><td><span class="swatch" style="background:#00a"></span>Azul</td><td>0x9</td><td><span class="swatch" style="background:#55f"></span>Azul claro</td></tr>
      <tr><td>0x2</td><td><span class="swatch" style="background:#0a0"></span>Verde</td><td>0xA</td><td><span class="swatch" style="background:#5f5"></span>Verde claro</td></tr>
      <tr><td>0x4</td><td><span class="swatch" style="background:#a00"></span>Rojo</td><td>0xC</td><td><span class="swatch" style="background:#f55"></span>Rojo claro</td></tr>
      <tr><td>0x6</td><td><span class="swatch" style="background:#a50"></span>Marrón</td><td>0xE</td><td><span class="swatch" style="background:#ff5"></span>Amarillo</td></tr>
      <tr><td>0x7</td><td><span class="swatch" style="background:#aaa"></span>Gris claro</td><td>0xF</td><td><span class="swatch" style="background:#fff"></span>Blanco</td></tr>
    </table>
    <p style="color:var(--text-dim); font-size:.82rem; margin-top:10px;">
      (tabla parcial — hay 16 en total; el patrón se repite en versión "clara" y "oscura" de cada color base)
    </p>
  </div>
</div>
`, {module:1, mtype:'teoria', clock:'18:15 – 19:35'});

addSlide(`
<div class="slide-inner animate__animated animate__fadeInUp" style="text-align:center; padding-top:6vh;">
  <div class="eyebrow" style="justify-content:center;">check de salida · módulo 1</div>
  <h1 class="title"><i class="fa-solid fa-palette accent"></i> Antes de escribir código...</h1>
  <p class="subtitle">Repasemos el byte de atributo</p>
  <button class="btn-quiz" onclick="quizModulo1()"><i class="fa-solid fa-play"></i> Iniciar repaso</button>
</div>
`, {module:1, mtype:'teoria', clock:'18:15 – 19:35'});

/* ============ MÓDULO 2 · PRÁCTICA ============ */

addSlide(`
<div class="mod-hero animate__animated animate__fadeIn">
  <div class="mod-num accent-amber">02</div>
  <div class="eyebrow">módulo 2 · práctica</div>
  <h1 class="title">De un <span class="accent-amber">byte</span> a una shell con <span class="accent">identidad</span></h1>
  <p class="subtitle" style="max-width:620px;">Vamos a escribir 3 piezas: color por texto, cajas con líneas, y una barra de estado fija.</p>
</div>
`, {module:2, mtype:'practica', clock:'19:45 – 21:00'});

addSlide(`
<div class="slide-inner animate__animated animate__fadeInUp">
  <div class="eyebrow">pieza 1 · color</div>
  <h1 class="title">Un <span class="accent-amber">pantalla_print_color()</span></h1>
  <div class="panel">
    <div class="code-block">
<span class="c-dim">// suponiendo que ya tenían algo como pantalla_print(char *s)</span>
<span class="c-gold">unsigned char</span> hacer_atributo(<span class="c-gold">unsigned char</span> texto, <span class="c-gold">unsigned char</span> fondo) {
    <span class="c-green">return</span> (fondo << 4) | (texto & 0x0F);
}

<span class="c-gold">void</span> pantalla_print_color(<span class="c-gold">char</span> *cadena, <span class="c-gold">unsigned char</span> atributo) {
    <span class="c-gold">char</span> *vidmem = (<span class="c-gold">char</span>*) 0xB8000;
    <span class="c-gold">int</span> offset = cursor_fila * 80 * 2 + cursor_col * 2;
    <span class="c-green">while</span> (*cadena) {
        vidmem[offset]     = *cadena;
        vidmem[offset + 1] = atributo;   <span class="c-dim">// acá está la diferencia con el print de siempre</span>
        offset += 2;
        cadena++;
    }
}
    </div>
    <p style="color:var(--text-dim); margin-top:12px; font-size:.9rem;">
      La única diferencia con el <code>pantalla_print</code> que ya tienen es que ahora también escriben el
      segundo byte de cada celda — antes probablemente quedaba en el valor que tuviera la memoria de antes,
      o en un valor fijo tipo "blanco sobre negro".
    </p>
  </div>
</div>
`, {module:2, mtype:'practica', clock:'19:45 – 21:00'});

addSlide(`
<div class="slide-inner animate__animated animate__fadeInUp">
  <div class="eyebrow">pieza 2 · cajas</div>
  <h1 class="title">Caracteres de <span class="accent-amber">dibujo de líneas</span></h1>
  <div class="panel">
    <p style="line-height:1.7;">
      La página de códigos que usa la VGA en modo texto (CP437) tiene, además de las letras normales,
      caracteres pensados para dibujar cajas: <code>┌ ─ ┐ │ └ ┘ ├ ┤</code>. No son ASCII estándar, pero
      tienen un código de byte fijo en esa página — por ejemplo <code>0xC9</code> es la esquina superior
      izquierda doble, <code>0xCD</code> es una línea horizontal doble.
    </p>
    <div class="code-block" style="margin-top:12px;">
<span class="c-gold">void</span> pantalla_dibujar_caja(<span class="c-gold">int</span> col, <span class="c-gold">int</span> fila, <span class="c-gold">int</span> ancho, <span class="c-gold">int</span> alto, <span class="c-gold">unsigned char</span> atributo) {
    pantalla_char_en(col, fila, 0xC9, atributo);                    <span class="c-dim">// ┌</span>
    pantalla_char_en(col + ancho - 1, fila, 0xBB, atributo);        <span class="c-dim">// ┐</span>
    pantalla_char_en(col, fila + alto - 1, 0xC8, atributo);         <span class="c-dim">// └</span>
    pantalla_char_en(col + ancho - 1, fila + alto - 1, 0xBC, atributo); <span class="c-dim">// ┘</span>
    <span class="c-green">for</span> (<span class="c-gold">int</span> i = 1; i < ancho - 1; i++) {
        pantalla_char_en(col + i, fila, 0xCD, atributo);            <span class="c-dim">// ─ arriba</span>
        pantalla_char_en(col + i, fila + alto - 1, 0xCD, atributo); <span class="c-dim">// ─ abajo</span>
    }
    <span class="c-green">for</span> (<span class="c-gold">int</span> i = 1; i < alto - 1; i++) {
        pantalla_char_en(col, fila + i, 0xBA, atributo);            <span class="c-dim">// │ izquierda</span>

let current = 0;
const deck = document.getElementById('deck');
const dotsWrap = document.getElementById('dotsWrap');

slides.forEach((s, i) => {
  const div = document.createElement('div');
  div.className = 'slide' + (i === 0 ? ' active' : '');
  div.id = 'slide-' + i;
  div.innerHTML = s.html;
  deck.appendChild(div);

  const dot = document.createElement('span');
  dot.onclick = () => goTo(i);
  dotsWrap.appendChild(dot);
});
document.getElementById('counterTotal').textContent = slides.length;

function render(){
  document.querySelectorAll('.slide').forEach((el,i)=>{
    el.classList.toggle('active', i===current);
  });
  document.querySelectorAll('#dotsWrap span').forEach((d,i)=>{
    d.classList.toggle('on', i===current);
  });
  document.getElementById('counterNow').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/slides.length*100)+'%';

  const s = slides[current];
  const badge = document.getElementById('module-badge');
  badge.textContent = 'MÓDULO ' + s.module + ' · ' + (s.mtype === 'teoria' ? 'TEORÍA' : 'PRÁCTICA');
  badge.className = s.mtype === 'teoria' ? 'mod-teoria' : 'mod-practica';
  document.getElementById('clockLabel').textContent = s.clock;

  const active = document.getElementById('slide-'+current);
  const animEl = active.querySelector('.animate__animated');
  if(animEl){ animEl.style.animationDuration = '.5s'; }
}

function goTo(i){
  if(i<0 || i>=slides.length) return;
  current = i;
  render();
}
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') goTo(current+1);
  if(e.key === 'ArrowLeft') goTo(current-1);
});
render();

const swalBase = {
  background: 'var(--bg-1)',
  color: 'var(--text)',
  customClass: { popup: 'so-popup', title: 'so-title' },
  confirmButtonColor: '#f2b705',
  cancelButtonColor: '#6d7c8c',
};

async function askMC(title, text, options, correctIndex, explain){
  const {value} = await Swal.fire({
    ...swalBase,
    title,
    html: `<p style="text-align:left; color:var(--text-dim); margin-bottom:14px;">${text}</p>`,
    input: 'radio',
    inputOptions: Object.fromEntries(options.map((o,i)=>[i,o])),
    inputValidator: (v)=> !v && '¡Elegí una opción!',
    confirmButtonText: 'Responder',
  });
  const correct = String(value) === String(correctIndex);
  await Swal.fire({
    ...swalBase,
    icon: correct ? 'success' : 'error',
    title: correct ? '¡Correcto!' : 'No exactamente...',
    html: `<p style="color:var(--text-dim);">${explain}</p>`,
    confirmButtonText: 'Seguir',
  });
  return correct;
}

async function quizModulo1(){
  await askMC(
    'El byte de atributo',
    '¿Cómo se arma el byte de atributo a partir de un color de texto y uno de fondo?',
    ['(texto << 4) | fondo', '(fondo << 4) | texto', 'texto + fondo', 'fondo XOR texto'], 1,
    'El fondo ocupa los 4 bits altos y el texto los 4 bits bajos, así que se arma con (fondo << 4) | texto.'
  );
  await askMC(
    'Memoria de video',
    'En el modo texto VGA, ¿cuántos bytes ocupa cada celda de la grilla 80x25?',
    ['1 byte (solo el carácter)', '2 bytes (carácter + atributo)', '4 bytes', 'Depende del carácter'], 1,
    'Cada celda son siempre 2 bytes: uno para el carácter (código CP437) y otro para el atributo de color.'
  );
  Swal.fire({...swalBase, icon:'success', title:'Módulo 1 completo', text:'Ahora, a escribir el código.'});
}
